plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

repositories {
    maven {url = "https://maven.terraformersmc.com/releases/" }
    maven {url = "https://maven.shedaniel.me/" }
}

// 1. Determine which version we are targeting (default to 1.21.2)
def target = project.hasProperty('target') ? project.property('target') : '26.2'

// 2. Point to the file in the 'versions' folder
def propsFile = file("versions/${target}.properties")

// 3. Load the properties if the file exists
if (propsFile.exists()) {
    def props = new Properties()
    propsFile.withInputStream { props.load(it) }
    props.each { key, val ->
        // This injects the file's values into the project
        project.ext.set(key, val)
    }
} else {
    throw new GradleException("Could not find version config: ${propsFile}")
}

version = "${project.projectVersion}"

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_range", project.minecraft_range

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_range": project.minecraft_range
    }
}

dependencies {
    minecraft "com.mojang:minecraft:$project.minecraft_version"
    implementation "net.fabricmc:fabric-loader:$project.loader_version"
    implementation "net.fabricmc.fabric-api:fabric-api:$project.fabric_api_version"
    implementation "com.terraformersmc:modmenu:$project.modmenu_version"
    implementation "me.shedaniel.cloth:cloth-config-fabric:$project.clothconfig_version"
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar {
    from "LICENSE"
}

loom {
    runs {
        client {
            programArgs "--quickPlaySingleplayer", "New World"
            programArgs "--username", "Dev"
        }
    }
}